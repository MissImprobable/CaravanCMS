<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CaravanCMS</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <header class="header">
    <span class="header-title">CaravanCMS</span>
    <button id="settingsToggle" class="icon-button" title="Settings">⚙</button>
  </header>

  <!-- ── Settings panel (hidden unless opened, or shown first-run when unconfigured) ── -->
  <section id="settingsPanel" class="panel hidden">
    <h2>Settings</h2>
    <label>CaravanCMS server URL
      <input id="baseUrl" type="text" placeholder="https://your-server:61655" />
    </label>
    <label>API key
      <input id="apiKey" type="password" />
    </label>
    <label>Your name (recorded against logged messages)
      <input id="staffName" type="text" placeholder="e.g. Abigail" />
    </label>
    <label class="checkbox-label">
      <input id="autoLog" type="checkbox" checked />
      Automatically log emails from known customers
    </label>
    <div class="button-row">
      <button id="saveSettings" class="primary-button">Save</button>
      <button id="cancelSettings" class="secondary-button">Cancel</button>
    </div>
  </section>

  <!-- ── Main view ── -->
  <section id="mainPanel" class="panel">
    <div id="statusCard" class="card">
      <div id="statusText" class="status-text">Checking sender…</div>
      <div id="statusDetail" class="status-detail"></div>
      <div id="undoRow" class="hidden">
        <button id="undoButton" class="link-button">Undo</button>
      </div>
      <div id="confirmRow" class="hidden">
        <button id="confirmLogButton" class="primary-button">Log this email</button>
      </div>
    </div>

    <div class="section-heading">Attach to a different customer or caravan</div>
    <div class="card">
      <input id="searchBox" type="text" placeholder="Search by rego, VIN, make/model, or customer name" />
      <div id="searchResults" class="search-results"></div>
      <div id="selectedCaravan" class="selected-caravan hidden"></div>
      <button id="attachButton" class="primary-button hidden">Attach this email</button>
    </div>
  </section>

  <script src="taskpane.js"></script>
</body>
</html>
